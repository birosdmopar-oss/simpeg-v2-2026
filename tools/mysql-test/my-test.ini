# MAKE-001 - konfigurasi instance MySQL KHUSUS TEST (PHPUnit), terpisah dari MySQL dev Laragon (3306).
# Dipakai oleh start.ps1 (--defaults-file). datadir, log-error, dan pid-file diberikan start.ps1 lewat argumen,
# jadi file ini tidak memuat path mesin tertentu.
#
# Data di instance ini boleh hilang kapan saja: durability sengaja dilonggarkan demi kecepatan test.
# JANGAN pakai pengaturan ini untuk database dev/produksi.

[mysqld]
port=3307
bind-address=127.0.0.1
# X Protocol dimatikan: port 33060 sudah dipakai mysqld Laragon.
mysqlx=0

# Sama dengan Laragon/legacy: utf8mb4_unicode_ci, akun root tanpa password (lokal saja), timestamp eksplisit.
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default_authentication_plugin=mysql_native_password
explicit_defaults_for_timestamp=1
max_allowed_packet=512M

# Kecepatan: tanpa fsync per commit, tanpa doublewrite, tanpa binlog.
innodb_flush_log_at_trx_commit=2
innodb_doublewrite=0
skip-log-bin
sync_binlog=0
innodb_buffer_pool_size=1G
innodb_redo_log_capacity=512M
performance_schema=OFF
event_scheduler=OFF
